version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: congress_trades
      POSTGRES_USER: congress
      POSTGRES_PASSWORD: congress
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install -r backend/requirements.txt &&
      uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://congress:congress@postgres:5432/congress_trades
      SMTP_ENABLED: "false"
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    image: node:22
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    volumes:
      - ./:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
